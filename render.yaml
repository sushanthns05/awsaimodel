services:
  # ---------------------------------------------------------------------------
  # Render Web Service: FastAPI Backend API
  # ---------------------------------------------------------------------------
  - type: web
    name: sbg-recruitment-api
    runtime: python
    region: singapore
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python backend/run_api.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: STAGE
        value: prod
      - key: AWS_REGION
        value: ap-south-1
      - key: ORG_NAME
        value: AWS Student Builder Group
      - key: INSTITUTION
        value: SJB Institute of Technology
      - key: RECRUITMENT_CYCLE
        value: 2026-27
      - key: AI_PROVIDER
        value: deepseek
      - key: AI_BASE_URL
        value: https://api.deepseek.com/v1
      - key: AI_MODEL
        value: deepseek-flash
      - key: AI_API_KEY
        sync: false
      - key: INTAKE_KEY
        sync: false
      - key: CORS_ORIGIN
        value: https://sbg-recruitment-sjbit.web.app

  # ---------------------------------------------------------------------------
  # Render Background Worker: Asynchronous Queue Consumer
  # ---------------------------------------------------------------------------
  - type: worker
    name: sbg-recruitment-worker
    runtime: python
    region: singapore
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python backend/run_worker.py
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: STAGE
        value: prod
      - key: AWS_REGION
        value: ap-south-1
      - key: AI_PROVIDER
        value: deepseek
      - key: AI_BASE_URL
        value: https://api.deepseek.com/v1
      - key: AI_MODEL
        value: deepseek-flash
      - key: AI_API_KEY
        sync: false
      - key: PROCESSING_QUEUE_URL
        sync: false

